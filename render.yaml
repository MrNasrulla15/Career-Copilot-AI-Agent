services:
  - type: web
    name: career-copilot-by-nasrulla
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DEBUG
        value: "false"
